[project]
name = "markov-text-generator"
version = "0.1.0"
description = "Order-2 Markov chain text generator over plain-text corpora"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
